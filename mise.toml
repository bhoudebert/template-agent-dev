# mise en place for AgenticDev. Run `mise tasks` to list everything.
# Stdlib-only Python: any python3 >= 3.10 on PATH works, so none is pinned here.
min_version = "2024.11.0"

[env]
# Defaults = local Ollama. Override in .env (git-ignored; see .env.example).
AGENT_PROVIDER = "openai"
AGENT_BASE_URL = "http://localhost:11434/v1"
AGENT_MODEL = "gemma4:12b"
_.file = { path = ".env" }

# ---------- dev ----------
[tasks.test]
description = "Run the PROJECT tests (auto-detects npm, pytest, go, cargo, mvn)"
run = "sh tools/projecttest.sh"

[tasks."test:tools"]
description = "Run the template's own tool tests (tools/tests)"
run = "python3 -m unittest discover -s tools/tests"

[tasks.validate]
description = "Validate artifacts against schemas"
run = "python3 tools/validate.py"

[tasks.trace]
description = "Traceability check (story -> spec -> ADR -> QA)"
run = "python3 tools/trace_check.py"

[tasks.check]
description = "Everything deterministic: validate + trace + tests"
depends = ["validate", "trace", "test"]

[tasks.doctor]
description = "Check python, git, provider/model/endpoint setup"
run = "python3 tools/doctor.py"

[tasks.stages]
description = "List pipeline stages with role, gate, outputs"
run = "python3 tools/agentrun.py list"

# ---------- work items ----------
[tasks.new]
description = "Create a raw story with next id:  mise run new Export invoices as CSV"
usage = '''
arg "<title>" var=#true help="Story title (no quotes needed)"
flag "--text <text>" help="the request in your own words; otherwise edit the file afterwards"
flag "--bug" help="a bug: symptom, expected behaviour, reproduction (same US ladder, bug-shaped story)"
flag "--id <key>" help="adopt this id (e.g. a Jira key PROJ-4821) instead of the next number"
'''
run = 'python3 tools/items.py new-story ${usage_title} ${usage_text:+--text "$usage_text"} ${usage_id:+--id "$usage_id"} $([ "${usage_bug}" = "true" ] && echo --bug)'

[tasks.incident]
description = "Create an incident file from template:  mise run incident Checkout 500s"
usage = '''
arg "<title>" var=#true help="Incident title"
'''
run = 'python3 tools/items.py new-incident ${usage_title}'

[tasks.branch]
description = "Create the story branch feature/<US-id>-<slug> (fix/<INC-id>-<slug> for incidents)"
usage = '''
arg "<id>" help="US-002 or INC-001"
'''
run = 'python3 tools/items.py branch "${usage_id}"'

[tasks.hooks]
description = "Enable the repo git hooks (blocks agent names in commit messages)"
run = "git config core.hooksPath .githooks && echo 'hooks enabled: .githooks'"

[tasks.ship]
description = "Checks + push branch + open PR (never main):  mise run ship [--draft] [--base b] [--emergency]"
usage = '''
flag "--draft" help="open as draft PR"
flag "--base <branch>" default="main" help="PR base; use the parent branch for stacked PRs"
flag "--emergency" help="skip validate, trace, tests and evidence so a broken pipeline cannot block the fix"
'''
run = 'sh tools/ship.sh "${usage_base}" "${usage_draft}" "${usage_emergency}"'

[tasks.orient]
description = "Prompt mode: rules in force, where this branch/story is, and what is next"
usage = '''
arg "[id]" help="US-NNN / INC-NNN; default: from the branch name"
'''
run = 'python3 tools/orient.py ${usage_id}'

[tasks.next]
description = "Who acts next on this branch/story, and the command"
usage = '''
arg "[id]" help="US-NNN / INC-NNN; default: from the branch name"
'''
run = 'python3 tools/orient.py next ${usage_id}'

[tasks.prepare]
description = "Prompt mode: write the stage bundle (the recipe) and print its receipt"
usage = '''
arg "<stage>" help="story|spec|design|implement|test|qa|review|release|diagnose"
arg "<id>" help="Work item id"
'''
run = 'python3 tools/agentrun.py prepare "${usage_stage}" --id "${usage_id}"'

[tasks.apply]
description = "Prompt mode: verify the receipt, confine paths, validate, trace, log"
usage = '''
arg "<stage>" help="Stage name"
arg "<id>" help="Work item id"
flag "--receipt <code>" help="receipt printed at the end of the bundle"
flag "--response <file>" help="file of <<<FILE: path>>> blocks ('-' = stdin)"
flag "--worktree" help="you edited the files directly: verify them"
'''
run = '''
set -e
args=""
[ -n "${usage_response}" ] && args="$args --response ${usage_response}"
[ "${usage_worktree}" = "true" ] && args="$args --worktree"
python3 tools/agentrun.py apply "${usage_stage}" --id "${usage_id}" --receipt "${usage_receipt}" $args
'''

[tasks.index]
description = "Regenerate docs/INDEX.md (the map of stories, specs, ADRs, designs)"
run = "python3 tools/index.py"

[tasks."index:check"]
description = "Fail if docs/INDEX.md is stale"
run = "python3 tools/index.py --check"

[tasks.skip]
description = "Quick story: declare it needs no spec and/or no design:  mise run skip US-003 spec,design --reason \"copy fix\""
usage = '''
arg "<id>" help="Story id"
arg "<stages>" help="spec, design, spec,design, or none to clear"
flag "--reason <text>" help="why no spec/design is needed (required unless clearing)"
'''
run = 'python3 tools/items.py skip "${usage_id}" "${usage_stages}" --reason "${usage_reason}"'

[tasks.evidence]
description = "Does this branch leave evidence (a spec or test change) for its story?"
run = "python3 tools/evidence.py"

[tasks."kit:install"]
description = "Install this kit into another repo:  mise run kit:install ../my-repo [--with ci,docs,release,pointers] [--plan]"
usage = '''
arg "<target>" help="path of the repository to install into"
flag "--with <features>" help="optional features: ci, docs, release, pointers (core is always installed)"
flag "--plan" help="show what would change, write nothing"
'''
run = 'python3 tools/agentkit.py install --target "${usage_target}" ${usage_with:+--with "$usage_with"} $([ "${usage_plan}" = "true" ] && echo --plan)'

[tasks."kit:status"]
description = "Kit status in this repo: what is clean, what you edited, what the kit changed"
run = "sh tools/kit.sh status"

[tasks."kit:update"]
description = "Update the kit here on a new branch:  mise run kit:update [tools|agents|docs|ci|all] [--plan]"
usage = '''
arg "[scope]" var=#true help="tools, agents, docs, ci or all (default: tools agents docs; ci only when asked)"
flag "--plan" help="show what would change, write nothing"
'''
run = 'sh tools/kit.sh update ${usage_scope} $([ "${usage_plan}" = "true" ] && echo --plan)'

[tasks."kit:reconcile"]
description = "Resolve kit update conflicts with a model (or --brief to write briefs for an assistant)"
usage = '''
flag "--brief" help="write .agentkit/reconcile/*.md briefs instead of calling a model"
flag "--plan" help="list the conflicted files"
'''
run = 'sh tools/kit.sh reconcile $([ "${usage_brief}" = "true" ] && echo --brief) $([ "${usage_plan}" = "true" ] && echo --plan)'

[tasks."kit:uninstall"]
description = "Remove what the kit installed here (on a branch); --plan first"
usage = '''
flag "--plan" help="show what would be removed, write nothing"
'''
run = 'sh tools/kit.sh uninstall $([ "${usage_plan}" = "true" ] && echo --plan)'

[tasks."kit:todo"]
description = "What is left to do in this repo, in order (install, trust, hooks, CONTEXT.md, model, tests, first story)"
run = "sh tools/kit.sh todo"

[tasks."kit:check"]
description = "Fail if kit files in this repo still contain unresolved merge conflict markers"
run = "sh tools/kit.sh check"

[tasks.status]
description = "List stories, their status and the next stage"
run = "python3 tools/items.py list"

[tasks.advance]
description = "Guarded status bump after a gate:  mise run advance US-002 approved"
usage = '''
arg "<id>" help="Story id"
arg "<status>" help="draft|enriched|approved|specified|designed|implemented|done"
flag "--force" help="skip step/trace guard"
'''
run = 'python3 tools/items.py set-status "${usage_id}" "${usage_status}" ${usage_force:+--force}'

# ---------- agent stages ----------
# default: call LLM, write files, run checks.  --dry = prompt only.  --plan = no write.

[tasks."agent:story"]
description = "Enrich a raw story (analyst)"
alias = "story"
usage = '''
arg "<id>" help="Work item id, e.g. US-002"
flag "--dry" help="print prompt only, no LLM call"
flag "--plan" help="call LLM, show files, write nothing"
'''
run = 'sh tools/stage.sh story "${usage_id}" "${usage_dry}" "${usage_plan}"'

[tasks."agent:spec"]
description = "Write the OpenSpec change (spec-writer)"
alias = "spec"
usage = '''
arg "<id>" help="Work item id, e.g. US-002"
flag "--dry" help="print prompt only, no LLM call"
flag "--plan" help="call LLM, show files, write nothing"
'''
run = 'sh tools/stage.sh spec "${usage_id}" "${usage_dry}" "${usage_plan}"'

[tasks."agent:design"]
description = "Write design note + ADRs (architect)"
alias = "design"
usage = '''
arg "<id>" help="Work item id, e.g. US-002"
flag "--dry" help="print prompt only, no LLM call"
flag "--plan" help="call LLM, show files, write nothing"
'''
run = 'sh tools/stage.sh design "${usage_id}" "${usage_dry}" "${usage_plan}"'

[tasks."agent:implement"]
description = "Implement next tasks with tests (developer)"
alias = "implement"
usage = '''
arg "<id>" help="Work item id, e.g. US-002"
flag "--dry" help="print prompt only, no LLM call"
flag "--plan" help="call LLM, show files, write nothing"
'''
run = 'sh tools/stage.sh implement "${usage_id}" "${usage_dry}" "${usage_plan}"'

[tasks."agent:test"]
description = "Add missing tests (test-engineer)"
usage = '''
arg "<id>" help="Work item id, e.g. US-002"
flag "--dry" help="print prompt only, no LLM call"
flag "--plan" help="call LLM, show files, write nothing"
'''
run = 'sh tools/stage.sh test "${usage_id}" "${usage_dry}" "${usage_plan}"'

[tasks."agent:qa"]
description = "QA report vs acceptance criteria"
alias = "qa"
usage = '''
arg "<id>" help="Work item id, e.g. US-002"
flag "--dry" help="print prompt only, no LLM call"
flag "--plan" help="call LLM, show files, write nothing"
'''
run = 'sh tools/stage.sh qa "${usage_id}" "${usage_dry}" "${usage_plan}"'

[tasks.review]
description = "Review the WHOLE PR/branch locally:  mise run review [id] [--post] [--commit]"
usage = '''
arg "[id]" help="US-NNN / INC-NNN; default: from the branch name"
flag "--post" help="create/update the single review comment on the branch's open PR"
flag "--commit" help="review only the last commit (cannot be combined with --post)"
'''
run = 'sh tools/review.sh "${usage_id}" "${usage_post}" "${usage_commit}"'

[tasks."agent:review"]
description = "Review the PR diff (reviewer)"
usage = '''
arg "<id>" help="Work item id, e.g. US-002"
flag "--dry" help="print prompt only, no LLM call"
flag "--plan" help="call LLM, show files, write nothing"
'''
run = 'sh tools/stage.sh review "${usage_id}" "${usage_dry}" "${usage_plan}"'

[tasks."agent:release"]
description = "Release notes + go/no-go"
alias = "release"
usage = '''
arg "<id>" help="Work item id, e.g. US-002"
flag "--dry" help="print prompt only, no LLM call"
flag "--plan" help="call LLM, show files, write nothing"
'''
run = 'sh tools/stage.sh release "${usage_id}" "${usage_dry}" "${usage_plan}"'

[tasks."agent:diagnose"]
description = "Triage a prod incident (sre)"
alias = "diagnose"
usage = '''
arg "<id>" help="Work item id, e.g. INC-001"
flag "--dry" help="print prompt only, no LLM call"
flag "--plan" help="call LLM, show files, write nothing"
'''
run = 'sh tools/stage.sh diagnose "${usage_id}" "${usage_dry}" "${usage_plan}"'

[tasks.agent]
description = "Any stage:  mise run agent spec US-002 [--dry|--plan]"
usage = '''
arg "<stage>" help="story|spec|design|implement|test|qa|review|release|diagnose"
arg "<id>" help="Work item id"
flag "--dry"
flag "--plan"
'''
run = 'sh tools/stage.sh "${usage_stage}" "${usage_id}" "${usage_dry}" "${usage_plan}"'

# ---------- setup ----------
[tasks.site]
description = "Build the documentation website and serve it on http://localhost:8000"
run = "python3 tools/build_site.py --serve"

[tasks."site:build"]
description = "Build site/docs/*.html from docs/*.md"
run = "python3 tools/build_site.py"

[tasks."install:github"]
description = "Copy CI + agent workflows to .github/workflows"
run = "sh adapters/install.sh github"

[tasks."install:tools"]
description = "Write CLAUDE.md / copilot / cursor pointers to AGENTS.md"
run = "sh adapters/install.sh tools"

[tasks.env]
description = "Show effective AGENT_* settings (secrets redacted)"
run = "env | grep '^AGENT_' | sed -E 's/(KEY=).*/\\1***/' | sort"
