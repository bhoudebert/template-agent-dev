# Builds agentkit.pyz (engine + the exact kit payload) and attaches it to the GitHub release.
# This is the kit's own workflow; it is not installed into adopting repositories.
name: release-pyz
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the asset to (e.g. v0.2.0)"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        run: python tools/build_pyz.py --version "${TAG#v}" --out dist/agentkit.pyz
      - name: Smoke test
        run: |
          python dist/agentkit.pyz --help
          tmp=$(mktemp -d) && cd "$tmp" && git init -q && git config user.name ci && git config user.email ci@example.com \
            && git commit -q --allow-empty -m init && python "$GITHUB_WORKSPACE/dist/agentkit.pyz" install --plan | head -5
      - name: Attach to the release
        run: gh release upload "$TAG" dist/agentkit.pyz dist/agentkit.pyz.sha256 --clobber
