# Builds `agentkit` (engine + the exact kit payload) and attaches it, with a checksum, to a GitHub release.
# This is the kit's own workflow; it is not installed into adopting repositories.
#
# Why it is called from release-please.yml and not only on `release: published`: a release created with the
# default token does not trigger other workflows, so a published-event workflow never ran for it.
# Run by hand to (re)attach: gh workflow run release-pyz.yml -f tag=v0.1.0
name: release-pyz
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the asset to (e.g. v0.2.0)"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        run: python tools/build_pyz.py --version "${TAG#v}" --out dist/agentkit
      - name: Smoke test
        run: |
          python dist/agentkit --help
          tmp=$(mktemp -d) && cd "$tmp" && git init -q && git config user.name ci && git config user.email ci@example.com \
            && git commit -q --allow-empty -m init && python "$GITHUB_WORKSPACE/dist/agentkit" install --plan | head -5
      - name: Attach to the release
        run: gh release upload "$TAG" dist/agentkit dist/agentkit.sha256 --clobber
