name: ci
on: [pull_request, push]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" | grep -Eq '^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([A-Za-z0-9._-]+\))?!?: .+' \
            || { echo "PR title must be a Conventional Commit, e.g. feat(US-002): export invoices"; exit 1; }
      - name: No agent attribution in PR text or commits
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          # release-please writes a fixed PR body ("generated with Release Please"). The title and the
          # commits are still checked; only that tool-written body is skipped.
          case "$HEAD" in
            release-please--*) BODY="" ;;
          esac
          printf '%s\n%s\n' "$TITLE" "$BODY" | python tools/check_attribution.py --stdin
          python tools/check_attribution.py --range "origin/$BASE..HEAD"
      - name: Evidence floor (a spec or test change for the story)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python tools/evidence.py --base "origin/$BASE" --branch "$HEAD_REF"
      - run: python tools/validate.py
      - run: python tools/trace_check.py
      - name: Index is up to date
        run: python tools/index.py --check
      - name: Kit tool tests (only in the kit's own repository; they are not installed elsewhere)
        if: hashFiles('tools/tests/*.py') != ''
        run: python -m unittest discover -s tools/tests
      - uses: actions/setup-node@v4
        if: hashFiles('package.json', '*/package.json') != ''
        with: { node-version: 24 }
      - name: Project setup (your .agents/ci-setup.sh: install dependencies, start services)
        if: hashFiles('.agents/ci-setup.sh') != ''
        run: sh .agents/ci-setup.sh
      - name: Project tests
        run: sh tools/projecttest.sh
